name: Enviar avisos SIGCA
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
jobs:
  procesar:
    runs-on: ubuntu-latest
    steps:
      - name: Procesar avisos pendientes
        env:
          CRON_SECRET: ${{ secrets.SIGCA_CRON_SECRET }}
          API_URL: ${{ vars.SIGCA_API_URL }}
        run: |
          test -n "$CRON_SECRET"
          test -n "$API_URL"
          curl --fail --show-error --silent --max-time 90 \
            -X POST "$API_URL/api/avisos/procesar" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H 'Content-Type: application/json'
